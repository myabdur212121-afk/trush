[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "1fill2blank-manim"
version = "0.1.0"
description = "1Fill2Blank channel — brand logo module and year-based Manim project archive"
requires-python = ">=3.10"
dependencies = ["manim"]

[tool.setuptools.packages.find]
include = ["year2026*", "my_1fill2blank*"]
