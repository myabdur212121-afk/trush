<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>নিরীহ বাঙালি — অনুশীলন প্রশ্নপত্র</title>
  <style>
    :root{
      --ink:#24231f;--muted:#6d685e;--paper:#f8f3e8;--paper-deep:#f0e8d8;
      --desk:#d7d0c3;--line:#b8ad9a;--accent:#274c3d;--accent2:#9b6239;--answer:#edf1e7;
      --right:#2e6b45;--wrong:#a33d2e;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:
      radial-gradient(circle at 18% 8%,rgba(255,255,255,.48),transparent 23rem),
      repeating-linear-gradient(90deg,rgba(90,70,45,.018) 0 1px,transparent 1px 5px),var(--desk);
      color:var(--ink);font-family:"Noto Serif Bengali","Nirmala UI","SolaimanLipi",serif;line-height:1.65}
    .toolbar{position:sticky;top:0;z-index:30;background:rgba(39,45,41,.96);color:#fff;
      border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 3px 16px #403a3280}
    .toolbar-inner{max-width:1050px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .brand{font-family:system-ui,sans-serif;font-weight:700;margin-right:auto;white-space:nowrap}
    .brand small{display:block;font-size:10px;font-weight:500;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
    button,.chip{font:600 12px system-ui,sans-serif;border:1px solid rgba(255,255,255,.26);border-radius:5px;
      background:transparent;color:#fff;padding:7px 10px;cursor:pointer;transition:.18s}
    button:hover,.chip:hover{background:rgba(255,255,255,.12)}
    button.primary{background:#e9dfcd;color:#282e2b;border-color:#e9dfcd}
    .progress-wrap{width:150px;font:11px system-ui,sans-serif;color:#ddd}
    .progress-track{height:4px;margin-top:3px;border-radius:5px;background:#ffffff25;overflow:hidden}
    .progress-fill{height:100%;width:0;background:#e2bd75;transition:.3s}
    .modebar{background:rgba(33,38,35,.93);border-bottom:1px solid rgba(255,255,255,.1)}
    .modebar-inner{max-width:1050px;margin:auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
    .mode{font:600 12.5px system-ui,sans-serif;border:1px solid rgba(255,255,255,.22);border-radius:20px;
      background:transparent;color:#d8d4ca;padding:7px 14px;cursor:pointer;transition:.18s}
    .mode:hover{background:rgba(255,255,255,.1)}
    .mode.active{background:#e9dfcd;color:#282e2b;border-color:#e9dfcd;font-weight:700}
    .page-wrap{padding:38px 16px 70px}
    .paper{width:min(210mm,100%);min-height:297mm;margin:0 auto;padding:18mm 17mm 20mm;
      background-color:var(--paper);background-image:
      radial-gradient(circle at 30% 20%,rgba(104,83,49,.025) 0 1px,transparent 1.5px),
      linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0));background-size:7px 7px,100% 100%;
      box-shadow:0 2px 3px #3f382d28,0 16px 45px #3f382d42;position:relative}
    .paper:before{content:"";position:absolute;inset:8px;border:1px solid rgba(78,65,45,.13);pointer-events:none}
    .exam-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px}
    .seal{width:44px;height:44px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;
      margin:0 auto 6px;font:700 18px Georgia;color:var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--accent)}
    h1{font-size:26px;line-height:1.2;margin:2px 0 4px;letter-spacing:.01em}
    .subtitle{font-size:14px;color:var(--muted)}
    .meta{display:grid;grid-template-columns:1fr 1fr 1fr;margin:10px 0 0;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
    .meta span:first-child{text-align:left}.meta span:last-child{text-align:right}
    .student-line{display:grid;grid-template-columns:2fr 1fr;gap:30px;margin:17px 0 12px;font-size:13px}
    .blank{display:inline-block;width:70%;border-bottom:1px dotted #706b62;transform:translateY(-3px)}
    .instructions{border:1px solid var(--line);background:#f3ecdf;padding:10px 13px;margin:12px 0 20px;font-size:13px}
    .instructions strong{color:var(--accent)}
    .section{margin:26px 0 6px;scroll-margin-top:120px}
    .section-head{display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:5px}
    .section-head h2{font-size:18px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:0 0 2px auto}
    .question{padding:14px 3px 15px;border-bottom:1px dashed #b9ae9b;break-inside:avoid}
    .qtop{display:flex;align-items:flex-start;gap:8px}
    .qnum{font:700 12px Georgia,serif;width:25px;height:25px;flex:0 0 25px;border:1px solid #777066;border-radius:50%;display:grid;place-items:center}
    .qbody{flex:1;min-width:0;font-size:15px}
    .qtext{margin:0}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
    .opt{display:flex;align-items:flex-start;gap:8px;text-align:left;font-family:inherit;font-size:14px;
      background:#fbf7ee;border:1px solid #c9bfab;border-radius:5px;color:var(--ink);padding:8px 10px;cursor:pointer;transition:.15s}
    .opt:hover{background:#f3ecdc;border-color:#a89a80}
    .opt .k{font-weight:700;flex:0 0 auto;width:22px;height:22px;border:1px solid #8d8574;border-radius:50%;
      display:grid;place-items:center;font-size:12px;background:var(--paper)}
    .opt.correct{background:#e7efe6;border-color:var(--right);box-shadow:inset 0 0 0 1px var(--right)}
    .opt.correct .k{background:var(--right);color:#fff;border-color:var(--right)}
    .opt.wrong{background:#f6e7e2;border-color:var(--wrong);box-shadow:inset 0 0 0 1px var(--wrong)}
    .opt.wrong .k{background:var(--wrong);color:#fff;border-color:var(--wrong)}
    .opt:disabled{cursor:default;opacity:.92}
    .verdict{display:none;margin-top:8px;font:600 12px system-ui,sans-serif}
    .verdict.right{display:block;color:var(--right)}
    .verdict.wrong{display:block;color:var(--wrong)}
    .uddipok{margin:10px 0 4px;padding:10px 13px;border:1px dashed #a2977f;background:#f5efe1;font-size:14px;color:#4c4538}
    .uddipok em{font-style:normal;font-weight:700;color:var(--accent2);font-size:11px;font-family:system-ui,sans-serif;
      display:block;margin-bottom:3px;letter-spacing:.05em}
    .cq-sub{display:flex;gap:9px;align-items:flex-start;padding:9px 2px 4px}
    .cq-k{font-weight:700;flex:0 0 22px;width:22px;height:22px;border:1px solid #8d8574;border-radius:4px;
      display:grid;place-items:center;font-size:12px;background:#fbf7ee}
    .cq-body{flex:1;font-size:14.5px}
    .marks{font:italic 11px Georgia;color:var(--muted);white-space:nowrap;margin-left:8px}
    .level{font:600 9px system-ui,sans-serif;letter-spacing:.03em;border:1px solid #b8ad9a;border-radius:10px;padding:1px 6px;color:#6c6255;margin-left:6px;vertical-align:2px}
    .actions{display:flex;align-items:center;gap:8px;margin-top:7px}
    .solution-btn{color:var(--accent);border-color:#9ca99f;background:#eef0e8;padding:5px 9px}
    .solution-btn:hover{background:#e1e8dd}
    .done-label{font:11px system-ui,sans-serif;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
    .done-label input{accent-color:var(--accent)}
    .solution{display:none;margin:9px 0 4px;padding:11px 13px 10px 16px;background:var(--answer);border-left:3px solid var(--accent);font-size:14px}
    .solution.open{display:block;animation:reveal .2s ease-out}
    @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    .solution strong{color:var(--accent)}
    .solution .step{display:block;margin:6px 0 0;padding-left:10px;border-left:2px solid #c5cfc0}
    .src{font:10px system-ui,sans-serif;color:#8a8172;margin-top:6px}
    .paper-foot{margin-top:28px;padding-top:10px;border-top:2px solid var(--ink);text-align:center;font-size:12px;color:var(--muted)}
    .legend{font:11px system-ui,sans-serif;margin-top:5px}
    .toast{position:fixed;right:18px;bottom:18px;background:#243b32;color:#fff;padding:10px 14px;border-radius:5px;
      font:12px system-ui,sans-serif;box-shadow:0 5px 20px #0004;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
    .toast.show{opacity:1;transform:none}
    @media(max-width:700px){.page-wrap{padding:12px 0 40px}.paper{padding:12mm 7mm}.paper:before{display:none}h1{font-size:22px}
      .meta{font-size:11px}.toolbar-inner{gap:6px}.progress-wrap{display:none}.student-line{gap:12px}.options{grid-template-columns:1fr}}
    @media print{
      body{background:#fff}.toolbar,.modebar,.actions,.toast,.verdict{display:none!important}.page-wrap{padding:0}
      .paper{width:100%;padding:12mm 14mm;box-shadow:none;background:var(--paper)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
      .paper:before{display:none}.question{break-inside:avoid}.solution{display:none!important}.exam-head{break-after:avoid}
      .opt{background:#fff}.opt.correct,.opt.wrong{background:#fff;border-color:#c9bfab;box-shadow:none}
      .opt.correct .k,.opt.wrong .k{background:var(--paper);color:var(--ink);border-color:#8d8574}
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="brand">নিরীহ বাঙালি <small>রোকেয়া সাখাওয়াত হোসেন · Practice</small></div>
      <div class="progress-wrap"><span id="progressText">সম্পন্ন ০/০</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
      <button onclick="toggleAll(true)">সব উত্তর দেখুন</button>
      <button onclick="toggleAll(false)">সব উত্তর লুকান</button>
      <button onclick="resetAll()">আবার শুরু</button>
      <button class="primary" onclick="window.print()">প্রিন্ট / PDF</button>
    </div>
  </header>
  <nav class="modebar">
    <div class="modebar-inner">
      <button class="mode" data-mode="mcq"   onclick="setMode('mcq')">বহুনির্বাচনি প্রশ্ন</button>
      <button class="mode" data-mode="short" onclick="setMode('short')">সংক্ষিপ্ত প্রশ্ন</button>
      <button class="mode" data-mode="kkgg"  onclick="setMode('kkgg')">ক · খ · গ · ঘ অনুশীলন</button>
      <button class="mode" data-mode="fullcq" onclick="setMode('fullcq')">পূর্ণ সৃজনশীল প্রশ্ন</button>
      <button class="mode" data-mode="paper" onclick="setMode('paper')">পূর্ণ প্রশ্নপত্র (৩০+৫+১)</button>
    </div>
  </nav>

  <main class="page-wrap">
    <article class="paper">
      <section class="exam-head">
        <div class="seal">প</div>
        <div class="subtitle" id="examSet">নিরীহ বাঙালি · রোকেয়া সাখাওয়াত হোসেন</div>
        <h1 id="examTitle">অনুশীলন প্রশ্নপত্র</h1>
        <div class="subtitle" id="examSubtitle"></div>
        <div class="meta"><span id="metaTime">সময়: নিজের গতিতে</span><span id="metaCount"></span><span id="metaMarks"></span></div>
      </section>
      <div class="student-line"><div>নাম: <span class="blank"></span></div><div>তারিখ: <span class="blank"></span></div></div>
      <aside class="instructions" id="instBox"></aside>
      <div id="questions"></div>
      <footer class="paper-foot">— সমাপ্ত —<div class="legend">আগে বুঝবে, তারপর মনে রাখবে, তারপর অনুশীলন করবে।</div></footer>
    </article>
  </main>
  <div class="toast" id="toast"></div>
<script>
/* ============================================================
   নিরীহ বাঙালি — প্রশ্নব্যাংক (বিস্তারিত ব্যাখ্যাসহ সংস্করণ)
   উৎস-নীতি: existing = পাঠ্যবইয়ের নমুনা প্রশ্ন/টীকা · adapted =
   অনলাইন শিক্ষা-উৎস থেকে সংগৃহীত ও মূল পাঠে যাচাইকৃত ·
   AI_generated = মূল পাঠ থেকে তৈরি
   ============================================================ */
const mcqBank=[
/* ---- লেখক-পরিচিতি ---- */
{q:'রোকেয়া সাখাওয়াত হোসেন কত খ্রিষ্টাব্দে জন্মগ্রহণ করেন?',options:['১৮৭৮','১৮৮০','১৮৮৫','১৮৯০'],answer:1,explain:'লেখক-পরিচিতিতে স্পষ্ট লেখা আছে — রোকেয়া সাখাওয়াত হোসেন ৯ই ডিসেম্বর, ১৮৮০ খ্রিষ্টাব্দে জন্মগ্রহণ করেন। বাকি সালগুলো (১৮৭৮, ১৮৮৫, ১৮৯০) কাছাকাছি রেখে বিভ্রান্ত করার জন্য দেওয়া হয় — এমন প্রশ্নে সাল হুবহু মুখস্থ থাকা জরুরি। মনে রাখার কৌশল: তাঁর জন্ম ও মৃত্যু দুটোই ৯ই ডিসেম্বর — জন্ম ১৮৮০, মৃত্যু ১৯৩২; এই "একই তারিখ" ব্যাপারটা পরীক্ষায় বারবার আসে।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'রোকেয়া সাখাওয়াত হোসেনের জন্মস্থান কোথায়?',options:['ভাগলপুর, বিহার','কলকাতা','পায়রাবন্দ, রংপুর','ঢাকা'],answer:2,explain:'তিনি রংপুর জেলার পায়রাবন্দ গ্রামে সম্ভ্রান্ত ভূস্বামী পরিবারে জন্মগ্রহণ করেন। এখানে সবচেয়ে বড় ফাঁদ "ভাগলপুর, বিহার" — এটি তাঁর জন্মস্থান নয়, স্বামী সৈয়দ সাখাওয়াত হোসেনের বাড়ি; বিয়ের পর তিনি সেখানে যান। পরীক্ষায় জন্মস্থান ও শ্বশুরবাড়ি উল্টাপাল্টা করে অপশন সাজানো হয়, তাই দুটি আলাদা করে মনে রাখো: জন্ম → পায়রাবন্দ (রংপুর), বিয়ের পর → ভাগলপুর (বিহার)।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'রোকেয়ার পিতার নাম কী?',options:['জহীরুদ্দিন মোহাম্মদ আবু আলী হায়দার সাবের','ইব্রাহিম সাবের','সৈয়দ সাখাওয়াত হোসেন','আবু হায়দার খান'],answer:0,explain:'পিতা জহীরুদ্দিন মোহাম্মদ আবু আলী হায়দার সাবের ছিলেন সম্ভ্রান্ত ভূস্বামী। ভুল অপশনগুলো খেয়াল করো — "ইব্রাহিম সাবের" তাঁর বড় ভাই (যাঁর কাছে ইংরেজি শেখেন) আর "সৈয়দ সাখাওয়াত হোসেন" তাঁর স্বামী; পরিবারের তিনজনের নাম গুলিয়ে দেওয়াই এ ধরনের প্রশ্নের কৌশল। পিতার নামের শেষে "সাবের" আছে বলে ভাইয়ের নামের সঙ্গে মিল — তাই পুরো নামটাই মনে রাখা নিরাপদ।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'ছোটবেলায় রোকেয়াকে বাংলা শিক্ষায় সাহায্য করেন কে?',options:['বড় ভাই ইব্রাহিম সাবের','বড় বোন করিমুন্নেসা','পিতা','স্বামী'],answer:1,explain:'সে যুগে মুসলিম মেয়েদের প্রথাগত লেখাপড়ার সুযোগ ছিল না; তাই ঘরে বড় বোন করিমুন্নেসা লুকিয়ে রোকেয়াকে বাংলা শেখাতে সাহায্য করেন। বড় ভাই ইব্রাহিম সাবের শেখান ইংরেজি — বাংলা নয়; পরীক্ষায় এই দুজনকে অদলবদল করে ভুল অপশন বানানো হয়। মনে রাখো: বোন → বাংলা (দুটোই "ব" দিয়ে), ভাই → ইংরেজি।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},

{q:'"সৌকুমার্য" শব্দের অর্থ কী?',options:['কোমলতা','সৌন্দর্য','সৌরভ','স্নিগ্ধতা'],answer:1,explain:'পাঠ্যবইয়ের শব্দার্থ ও টীকা অংশে সরাসরি দেওয়া আছে: সৌকুমার্য = সৌন্দর্য। এই প্রশ্নের কঠিন দিক হলো — ভুল অপশনগুলোও (কোমলতা, সৌরভ, স্নিগ্ধতা) একই বাক্যের আশেপাশের শব্দ, তাই মনে হয় সবই ঠিক; কিন্তু বইয়ের টীকা যেটা বলে সেটাই চূড়ান্ত উত্তর। বাক্যটি মনে রাখো: "কুসুমের সৌকুমার্য" = ফুলের সৌন্দর্য — ফুলের প্রধান গুণ সৌন্দর্যই, এভাবে যুক্তি দিয়েও মনে রাখা যায়।',source:'existing · পাঠ্যবইয়ের টীকা'},

{q:'ভারতবর্ষকে উপন্যাস মনে করলে বাঙালি তার—',options:['লেখক','নায়ক','পাঠক','নায়িকা'],answer:3,explain:'"যদি ভারতবর্ষকে একখানা উপন্যাস মনে করেন, তবে বাঙালি তাহার নায়িকা!" — লক্ষ করো, নায়ক নয়, নায়িকা। এটাই প্রশ্নের আসল ফাঁদ এবং লেখিকার আসল খোঁচা: বাঙালি পুরুষ হয়েও তার ভূমিকা নারীর মতো — কোমল, শোভাময়, পরনির্ভর। এই ধারাতেই পরের বাক্যে আসে "পুরুষ সমাজে বাঙালি পুরুষিকা" — সব উপমা মিলিয়েই সিদ্ধান্ত "আমরা মূর্তিমান কাব্য"।',source:'adapted · sohagschool.com'},

{q:'আমাদের দেশের প্রধান ফলগুলো কেমন?',options:['টক','তিতা','রসালো ও মধুর','পানসে'],answer:2,explain:'আম ও কাঁঠাল — "রসাল এবং মধুর"; এই দুটি বিশেষণ থেকেই খাদ্যের তৃতীয় গুণ "মধুর" এসেছে এবং ত্রিগুণাত্মক তালিকা পূর্ণ হয়েছে। লেখিকার পরোক্ষ খোঁচাটাও বুঝে রাখো — এমন মিষ্টি রসাল খাবার খেয়ে খেয়েই বাঙালির শরীর-মন দুটোই নরম আর অলস হয়েছে; পরের অনুচ্ছেদেই তাই আসে ভুঁড়ি আর ভীরুতার কথা। টক-তিতা-পানসে কোনোটিই প্রবন্ধে নেই।',source:'adapted · protipsnetbd.com'},
{q:'লেখিকা সজিনার সঙ্গে বাঙালির কীসের সাদৃশ্য দেখিয়েছেন?',options:['হাড়ের','ভুঁড়ির','চুলের','মেজাজের'],answer:1,explain:'"তাই সজিনা যেমন বীজবহুল, আমাদের দেশে তেমনই ভুঁড়িটি স্থূল" — সজিনার ডাঁটার ভেতর যেমন সারি সারি বীজ ঠাসা, বাঙালির পেটও তেমনি মোটা ভুঁড়িতে ভরা! যুক্তির ছদ্মবেশে ("খাদ্যের গুণ অনুসারে শরীরের পুষ্টি হয়") এটি নিখাদ রসিকতা — যা খাই তা-ই নাকি শরীরে ফুটে ওঠে। অলস জীবনযাপন আর ভোজনবিলাসের ফল এই ভুঁড়ি — ব্যঙ্গটা আসলে সেখানেই।',source:'adapted · mukhosh.net'},

{q:'আমরা সময় সময় সভ্যতার অনুরোধে কী ব্যবহার করি?',options:['ছাতা','কোট-শার্ট','জুতা','টুপি'],answer:1,explain:'"আমরা সময় সময় সভ্যতার অনুরোধে কোট শার্ট ব্যবহার করি বটে, কারণ পুরুষমানুষের সবই সহ্য হয়।" — "সভ্যতার অনুরোধে" মানে ইংরেজদের দেখাদেখি, সমাজে "সভ্য" সাজতে। খোঁচাটা দুই স্তরে: এক, নিজের সংস্কৃতিতে আস্থা নেই, সাহেবি পোশাকে ভদ্র সাজতে হয়; দুই, গরমের দেশে অপ্রয়োজনীয় কোট-শার্ট পরার কষ্টটাও পুরুষরা "সহ্য" করে — অথচ সত্যিকার পরিশ্রম সহ্য করে না! এই বৈপরীত্যই পরের প্রশ্নের বিষয়।',source:'adapted · taslimalamrafi blog'},

{q:'"হাওয়ার শাড়ি" বলতে বোঝায়—',options:['সূক্ষ্ম সুতোর পাতলা শাড়ি','রঙিন ছাপার শাড়ি','মোটা তাঁতের শাড়ি','জামদানি শাড়ি'],answer:0,explain:'পাঠ্যবইয়ের টীকা: হাওয়ার শাড়ি = সূক্ষ্ম সুতোর শাড়ি; পাতলা শাড়ি — নামটাই বলে দিচ্ছে, এত মিহি যেন হাওয়া দিয়ে বোনা। ঢাকাই মসলিনের যুগের এই শাড়ি এতই স্বচ্ছ-পাতলা ছিল যে লেখিকা একে দিয়ে নারীদের পোশাক-বিলাসিতার খোঁচা দিয়েছেন — "লজ্জাবতী" নারীরাই পরেন সবচেয়ে পাতলা কাপড়! জামদানি বা তাঁতের শাড়ি অপশনে থাকলেও টীকার সংজ্ঞাই চূড়ান্ত উত্তর।',source:'existing · পাঠ্যবইয়ের টীকা'},

{q:'সিন্দাবাদ কোন গ্রন্থের চরিত্র?',options:['আরব্য উপন্যাস','শাহনামা','রামায়ণ','ইলিয়াড'],answer:0,explain:'"আমরা (আরব্যোপন্যাসের) সিন্দাবাদের ন্যায় বাণিজ্যপোত অনিশ্চিত ফললাভের আশায় অনন্ত অপার সাগরে ভাসাইয়া দিয়া নৈরাশ্যের ঝঞ্ঝাবাতে ওতপ্রোত হই না" — বন্ধনীতে লেখিকা নিজেই উৎস বলে দিয়েছেন: আরব্য উপন্যাস (আরব্য রজনী/Arabian Nights)। সিন্দাবাদ সাত সমুদ্রে ঝুঁকি নিয়ে বাণিজ্য করে ধনী হয়েছিল — বাঙালি সেই ঝুঁকিই নেয় না, এটাই তুলনার উদ্দেশ্য। ঝঞ্ঝাবাতে = ঝড়ের বাতাসে (বইয়ের টীকা) — এই শব্দার্থটাও সঙ্গে শিখে রাখো।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},

{q:'পাস বিক্রেতার নাম কী?',options:['শ্বশুর','বর','ঘটক','কনে'],answer:1,explain:'"এই পাস বিক্রেতার নাম বর এবং ক্রেতাকে শ্বশুর বলে।" — কে বেচে আর কে কেনে, এই দিকটা পরিষ্কার বুঝে নাও: শিক্ষিত ছেলে (বর) নিজের ডিগ্রি "বেচছে", আর মেয়ের বাবা (শ্বশুর) যৌতুক দিয়ে তা "কিনছেন"। পরীক্ষায় বিক্রেতা-ক্রেতা উল্টে দিয়ে ভুল অপশন সাজানো হয়; মনে রাখার সূত্র — যার জিনিস (ডিগ্রি) সে-ই বিক্রেতা, অর্থাৎ বর।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'পাসের ক্রেতাকে কী বলা হয়?',options:['বর','ঘটক','শ্বশুর','কনের ভাই'],answer:2,explain:'ক্রেতা = শ্বশুর — যিনি মেয়ের বিয়ের জন্য যৌতুকের টাকায় শিক্ষিত জামাই "কিনে" আনেন। ভাবো তো, বিয়ের মতো পবিত্র সম্পর্ককে লেখিকা কেনাবেচার ভাষায় নামিয়ে এনেছেন — বর "বিক্রেতা", শ্বশুর "ক্রেতা", ডিগ্রি "পণ্য" — এই রূপকের ধাক্কাটাই যৌতুকপ্রথার কুৎসিত চেহারাটা চোখে আঙুল দিয়ে দেখায়। আগের প্রশ্নের সঙ্গে জোড়ায় মনে রাখো: বর বেচে, শ্বশুর কেনে।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'লেখিকার মতে এক একটি পাসের মূল্য কত?',options:['একটি বাড়ি ও এক রাজকুমারী','পূর্ণ রাজত্ব','অর্ধেক রাজত্ব ও এক রাজকুমারী','এক লক্ষ টাকা'],answer:2,explain:'"এক একটি পাসের মূল্য কত জান? অর্ধেক রাজত্ব ও এক রাজকুমারী।" — রূপকথার রাজারা বীরত্বের পুরস্কারে অর্ধেক রাজত্ব আর রাজকন্যা দিতেন; এখানে বীরত্ব নয়, স্রেফ একটা পাসের সার্টিফিকেটেই সেই দাম! আরও মজা পরের অংশে — "নিতান্ত সস্তা দরে বিক্রয় হইলে, মূল্য — এক রাজকুমারী এবং সমুদয় রাজত্ব" — সস্তায় দাম আরও বেশি! এই স্ববিরোধই বোঝায় লোভের কোনো যুক্তি নেই। উদ্ধৃতিটা হুবহু মুখস্থ রাখো — শূন্যস্থান/উদ্ধৃতি-প্রশ্নেও আসে।',source:'adapted · mukhosh.net'},
{q:'কোন পাস "অমূল্যরত্ন" — যে সে ক্রেতার ক্রেয় নয়?',options:['বি.এ. পাশ','এম.এ. পাশ','ম্যাট্রিক পাশ','ডক্টরেট'],answer:1,explain:'"এম.এ. পাশ অমূল্যরত্ন, ইহা যে সে ক্রেতার ক্রেয় নহে।" — ক্রেয় মানে কেনার যোগ্য; অর্থাৎ এম.এ. ডিগ্রিধারী বরের এত দাম যে সাধারণ শ্বশুরের সাধ্যেই কুলাবে না! ডিগ্রি যত উঁচু, যৌতুকের রেট তত চড়া — শিক্ষার এই বাজারদর তৈরি হওয়াটাই ট্র্যাজেডি, যা লেখিকা হাসির মোড়কে দেখান। সে আমলে এম.এ.-ই ছিল সর্বোচ্চ প্রচলিত ডিগ্রি — তাই ডক্টরেট নয়, এম.এ.-ই উত্তর।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'"পাস বিক্রয়" অংশে লেখিকা মূলত কোন প্রথার সমালোচনা করেছেন?',options:['বাল্যবিবাহ','পর্দাপ্রথা','যৌতুকপ্রথা','জাতিভেদ প্রথা'],answer:2,explain:'পুরো রূপকটা খুলে দেখো — বর ডিগ্রি বেচে, শ্বশুর টাকা-সম্পদ দিয়ে কেনে, দাম "অর্ধেক রাজত্ব ও এক রাজকুমারী" — এই কেনাবেচার আসল নাম যৌতুক। শিক্ষিত যুবক পরিশ্রমে উপার্জনের বদলে শ্বশুরের সম্পদ লুটে সংসার শুরু করে — লেখিকা একে বলেছেন "(Old fool) শ্বশুরের যথাসর্বস্ব লুণ্ঠন"। বাল্যবিবাহ বা পর্দাপ্রথাও রোকেয়ার লেখার বিষয় ছিল, কিন্তু এই অংশে নিশানা স্পষ্টত যৌতুক — খ/গ/ঘ সৃজনশীল প্রশ্নেও এই পয়েন্টই কাজে লাগবে।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'সশরীরে পরিশ্রমে মুদ্রালাভ অপেক্ষা কী সহজ বলে বাঙালি ভেবেছে?',options:['(Old fool) শ্বশুরের যথাসর্বস্ব লুণ্ঠন','ব্যবসা করা','চাকরি করা','জমি চাষ করা'],answer:0,explain:'"আমরা অলস, তরলমতি, শ্রমকাতর, কোমলাঙ্গ বাঙালি কিনা তাই ভাবিয়া দেখিয়াছি, সশরীরে পরিশ্রম করিয়া মুদ্রালাভ করা অপেক্ষা (Old fool) শ্বশুরের যথাসর্বস্ব লুণ্ঠন করা সহজ।" — নিজের গায়ে খেটে টাকা রোজগারের চেয়ে "বোকা বুড়ো" (Old fool) শ্বশুরের সব সম্পদ হাতিয়ে নেওয়াই সহজ! চারটি বিশেষণও শিখে রাখো — অলস, তরলমতি (চঞ্চলমতি), শ্রমকাতর (পরিশ্রমে কাতর), কোমলাঙ্গ — বাঙালির আত্মপরিচয় হিসেবে এগুলো থেকেও MCQ হয়।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},

{q:'ত্রিবিধ দণ্ডের প্রথমটি কী?',options:['ফাঁসি','জবেহ','তুষানলে দগ্ধ করা','নির্বাসন'],answer:2,explain:'ক্রমটা প্রবন্ধে সংখ্যা দিয়েই দেওয়া: "(১) তুষানলে দগ্ধ কর, অতঃপর (২) জবেহ্ কর, তারপর (৩) ফাঁসি দাও!" — তুষানল মানে তুষের (ধানের খোসার) ধিকিধিকি আগুন, যাতে পোড়া সবচেয়ে যন্ত্রণাদায়ক। ক্রম উল্টে-পাল্টে অপশন দেওয়া হয় বলে ১-২-৩ সিরিয়ালটা মুখস্থ রাখো: তুষানল → জবেহ → ফাঁসি। "নির্বাসন" তালিকায় নেই-ই।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},

{q:'আমাদের কাব্যে কোন রস বেশি?',options:['বীররস','হাস্যরস','করুণরস','আদিরস'],answer:2,explain:'"আমরা সকলেই কবি — আমাদের কাব্যে বীররস অপেক্ষা করুণরস বেশি।" বীররস জাগায় সাহস ও কর্মপ্রেরণা, করুণরস ঝরায় চোখের জল — বাঙালির কবিতা বেছে নিয়েছে দ্বিতীয়টি। জাতির চরিত্র তার সাহিত্যে প্রতিফলিত হয়: ভীরু-অলস জাতির কাব্যে বীরত্বের জায়গা নেই, আছে শুধু হাহাকার — এই সংযোগটাই লেখিকার মূল বক্তব্য; খ-প্রশ্নে ("কেন করুণরস বেশি") এভাবেই ব্যাখ্যা দেবে।',source:'adapted · courstika.com'},
{q:'আমাদের এখানে লেখক অপেক্ষা কাদের সংখ্যা বেশি?',options:['পাঠকের','লেখিকার','কবির','সমালোচকের'],answer:1,explain:'"আমাদের এখানে লেখক অপেক্ষা লেখিকার সংখ্যা বেশি। তাই কবিতার স্রোতে বিনা কারণে অশ্রুপ্রবাহ বেশি বহিয়া থাকে।" — লেখিকা বেশি, তাই কান্নাও বেশি — এই সংযোগটা সে যুগের ছাঁচে নারীর আবেগপ্রবণতা নিয়ে রসিকতা। মজার দিক: রোকেয়া নিজেই একজন লেখিকা হয়ে লেখিকাদের নিয়ে ঠাট্টা করছেন — আত্মসমালোচনার এই সৎসাহসই তাঁর ব্যঙ্গকে আক্রমণ নয়, সংশোধনের হাতিয়ার বানিয়েছে।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'পদ্যের বিষয় হিসেবে কিছুই পরিত্যাজ্য নয় — উদাহরণ: (i) ভগ্ন শূর্প (ii) জীর্ণ কাঁথা (iii) পুরাতন চটিজুতা',options:['i ও ii','ii ও iii','i ও iii','i, ii ও iii'],answer:3,explain:'"আমরা পদ্য লিখিতে বসিলে কোন্ বিষয়টা বাদ দিই? ভগ্ন শূর্প, জীর্ণ কাঁথা, পুরাতন চটিজুতা — কিছুই পরিত্যাজ্য নহে।" — তিনটিই প্রবন্ধে আছে, তাই উত্তর i, ii ও iii। ভগ্ন শূর্প মানে ভাঙা কুলা — শব্দটা কঠিন বলে আলাদা করে শিখে রাখো। খোঁচাটা হলো: ভাঙা কুলা বা ছেঁড়া কাঁথার মতো তুচ্ছ জিনিস নিয়েও বাঙালি কবি আবেগের বন্যা বইয়ে দেয় — বিষয়ের গুরুত্ব নেই, কান্নাই মুখ্য!',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'"শুভ্রনীলাম্বর" অর্থ কী?',options:['সাদা মেঘ','পরিষ্কার নীল আকাশ','নীল শাড়ি','ভোরের আলো'],answer:1,explain:'পাঠ্যবইয়ের টীকা: শুভ্রনীলাম্বর = পরিষ্কার নীল আকাশ (শুভ্র = পরিষ্কার/সাদা, নীল + অম্বর = আকাশ)। প্রবন্ধে এটি এসেছে কবিদের "নতুন শব্দ সৃষ্টির" উদাহরণ হিসেবে — "আমরা আবার কত নতুন শব্দের সৃষ্টি করিয়াছি; যথা — অতি শুভ্রনীলাম্বর, সাশ্রুসজলনয়ন ইত্যাদি।" লেখিকার খোঁচা: কাজের উদ্ভাবন নেই, শুধু জমকালো শব্দ বানানোতেই যত প্রতিভা! শব্দ ভেঙে অর্থ করা শিখলে (অম্বর=আকাশ) এমন তৎসম শব্দ সহজে মনে থাকে।',source:'existing · পাঠ্যবইয়ের টীকা'},
{q:'"সাশ্রুসজলনয়ন" অর্থ কী?',options:['ঘুমন্ত চোখ','রাঙা চোখ','জলভরা চোখ','বন্ধ চোখ'],answer:2,explain:'পাঠ্যবইয়ের টীকা: সাশ্রুসজলনয়ন = জলভরা চোখ (স+অশ্রু = অশ্রুসহ, সজল = জলভরা, নয়ন = চোখ — একই অর্থ তিনবার!)। শব্দটা নিজেই ব্যঙ্গের নমুনা: চোখে জল বোঝাতে অশ্রু+জল দুটোই ঠেসে দেওয়া হয়েছে — কান্না যেন কিছুতেই কম না পড়ে! করুণরস-সর্বস্ব কবিদের অতিরঞ্জিত শব্দবিলাসের প্রতীক এটি; টীকার শব্দ বলে সংক্ষিপ্ত ও MCQ দুই ফরম্যাটেই প্রিয় প্রশ্ন।',source:'existing · পাঠ্যবইয়ের টীকা'},
{q:'কীসের বন্যায় বঙ্গদেশ ধীরে ধীরে ডুবে যাচ্ছে?',options:['নদীর জলের','অশ্রুজলের','বৃষ্টির','জোয়ারের'],answer:1,explain:'"শ্রীমতীদের করুণ বিলাপ-প্রলাপপূর্ণ পদ্যের অশ্রুজলের বন্যায় বঙ্গদেশ ধীরে ধীরে ডুবিয়া যাইতেছে!" — কবিতায় এত কান্না যে সেই চোখের জলেই দেশ ডুবে যাচ্ছে; চূড়ান্ত অতিরঞ্জনের (hyperbole) হাসি। গভীর অর্থটাও ধরো — দেশ সত্যিই "ডুবছে", তবে অশ্রুতে নয়, কর্মহীন আবেগসর্বস্বতায়; কাজের বদলে কান্নাই যখন জাতীয় অভ্যাস, তখন ডুবে যাওয়াই নিয়তি। ঘ-প্রশ্নে এই দুই স্তরের অর্থ লিখলেই পূর্ণ নম্বর।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},
{q:'প্রবন্ধের শেষ বাক্য "আর আত্মপ্রশংসা কত করিব? এখন উপসংহার করি" — এতে বোঝা যায়—',options:['লেখিকা সত্যিই গর্বিত','পুরো প্রবন্ধটিই ছিল আত্মপ্রশংসার ছদ্মবেশে ব্যঙ্গ','প্রবন্ধ অসমাপ্ত','লেখিকা ক্লান্ত'],answer:1,explain:'শেষ বাক্যে লেখিকা নিজেই মুখোশ খুলে দেন — এতক্ষণ যা লিখেছেন সবই নাকি "আত্মপ্রশংসা"! অথচ পাঠক জানে, প্রতিটি "প্রশংসা"-ই ছিল খোঁচা; সুতরাং স্বীকারোক্তিটাও ব্যঙ্গ — যেন বলছেন: আমাদের গর্ব করার মতো এই-ই তো সম্বল! গোটা প্রবন্ধের কাঠামো (প্রশংসার ভঙ্গি → শেষে ফাঁস) এই এক বাক্যে সম্পূর্ণ হয়। "শেষ বাক্যের তাৎপর্য বিশ্লেষণ করো" — ঘ-প্রশ্নের উত্তরে এটিই মূল পয়েন্ট।',source:'AI_generated (মূল পাঠ-ভিত্তিক)'},

{q:'"নিরীহ বাঙালি" প্রবন্ধে লেখিকা বাঙালি নারীর প্রতি যে মনোভাব ব্যক্ত করেছেন—',options:['প্রশংসাসূচক','উদাসীন','সমালোচনামূলক (ব্যঙ্গের মাধ্যমে)','ভীতিকর'],answer:2,explain:'নারীদের অহেতুক রূপচর্চা, রন্ধনে অনীহা, নিজেদের "অবলা দিব্যাঙ্গনা" প্রমাণের চেষ্টা, অশ্রুসর্বস্ব পদ্যচর্চা — সবই লেখিকা ব্যঙ্গের কাঠগড়ায় তুলেছেন; মনোভাবটি তাই সমালোচনামূলক। কিন্তু সমালোচনা মানে বিদ্বেষ নয় — নারী জাগরণের অগ্রদূত হিসেবে তিনি চান নারী এই দুর্বলতা ঝেড়ে কর্মক্ষম হোক; শাসনটা তাই মায়ের শাসনের মতো, ভালোবাসা থেকে। এই দ্বৈততা বোঝাতে পারলে ঘ-প্রশ্নে বাড়তি নম্বর নিশ্চিত।',source:'adapted · courstika.com'},
{q:'রোকেয়ার মতে বাঙালি পুরুষগণ সাধারণত—',options:['কর্মপ্রিয়','আরামপ্রিয়','ভ্রমণপ্রিয়','খেলাপ্রিয়'],answer:1,explain:'গোটা প্রবন্ধ জুড়ে প্রমাণের পাহাড় — টানাপাখার নিচে আরাম কেদারা, ঝুঁকিহীন দোকানদারি, পরিশ্রম লাগে বলে ধান-চালের ব্যবসাও বাদ, রোদ সহ্য হয় না, মাঠের বদলে Famine Report — সব মিলিয়ে বাঙালি পুরুষ আরামপ্রিয়। "কর্মপ্রিয়" ঠিক তার উল্টো — প্রবন্ধের মূল অভিযোগই কর্মবিমুখতা। এ ধরনের সার্বিক-চরিত্র প্রশ্নে কোনো এক লাইনে নয়, পুরো প্রবন্ধের সুর থেকে উত্তর দিতে হয়।',source:'adapted · taslimalamrafi blog'},

{q:'"তণ্ডুল" শব্দের অর্থ কী?',a:'তণ্ডুল শব্দের অর্থ চাল, যা "নিরীহ বাঙালি" প্রবন্ধে বাঙালির শ্রমবিমুখতা বোঝাতে ব্যবহৃত হয়েছে। লেখিকা লিখেছেন — "আমরা ধান্য তণ্ডুলের ব্যবসায় করি না, কারণ তাহাতে পরিশ্রম আবশ্যক।" ধান-চাল জাতির মৌলিক প্রয়োজনের পণ্য হলেও এর ব্যবসায় মজুদ, পরিবহন ও কায়িক শ্রম লাগে; তাই অলস বাঙালি সেদিকে না গিয়ে কেশতৈল, নকল গয়নার মতো বিলাসদ্রব্যের আরামের দোকানদারিই বেছে নেয়। ফলে এক তণ্ডুল শব্দেই বাঙালির অর্থনৈতিক অলসতার পুরো ছবিটি ধরা পড়ে।',source:'adapted · sohagschool.com'},
{q:'"দিব্যাঙ্গনা" বলতে কী বোঝায়?',a:'দিব্যাঙ্গনা বলতে স্বর্গের রূপসী বা হুরপরিকে বোঝায় — দিব্য অর্থ স্বর্গীয় আর অঙ্গনা অর্থ নারী। প্রবন্ধে লেখিকা রান্নাবিমুখ গৃহিণীদের ব্যঙ্গ করে এই জমকালো নামে ডেকেছেন, কারণ তাঁরা নিজেদের এতই কোমল ও মহার্ঘ ভাবেন যে রান্নাঘরের আগুনের তাপটুকুও তাঁদের সহ্য করানো যেন অন্যায়। এমনকি যে লক্ষ্মীছাড়া এই "স্বর্গীয় রূপসীদের" রান্না করতে বলে, তার তুষানল-জবেহ-ফাঁসি — ত্রিবিধ দণ্ডের দাবি ওঠে! প্রশংসাসূচক শব্দ দিয়েই অহংকার ও আলস্যকে খোঁচা দেওয়ার এ এক চমৎকার উদাহরণ।',source:'adapted · sohagschool.com'},
{q:'ভারতবর্ষ অট্টালিকা হলে বঙ্গদেশ কী?',a:'ভারতবর্ষকে ইংরেজি ধরনের অট্টালিকা মনে করলে বঙ্গদেশ তার বৈঠকখানা (drawing room) এবং বাঙালি সেই বৈঠকখানার সাজসজ্জা (drawing room suit)। বৈঠকখানা বাড়ির কাজের ঘর নয় — অতিথিকে দেখানোর সাজানো ঘর, আর সাজসজ্জা তো নিছক শোভার আসবাব; অর্থাৎ বিশাল ভারতবর্ষে বাঙালির ভূমিকা কেবল ঘর আলো করে বসে থাকা, কোনো কর্মে অংশ নেওয়া নয়। এই একটি উপমাতেই লেখিকা বাঙালির সৌন্দর্যপ্রীতি আর কর্মহীনতা — দুটোকেই এক সঙ্গে বিদ্ধ করেছেন।',source:'adapted · sohagschool.com'},
{q:'ভারতবর্ষ উপন্যাস হলে বাঙালি কী?',a:'ভারতবর্ষকে একখানা উপন্যাস মনে করলে বাঙালি হয় তার নায়িকা — লক্ষণীয়, নায়ক নয়। পুরুষপ্রধান জাতিকে ইচ্ছাকৃতভাবে নারীবাচক উপমা দিয়ে লেখিকা বাঙালির পৌরুষহীনতার প্রতি তীক্ষ্ণ খোঁচা দিয়েছেন: নায়িকা উপন্যাসের শোভা, কিন্তু কাহিনির কঠিন সংগ্রামগুলো সাধারণত নায়কের ভাগে। একই ধারায় সরোবরের উপমায় বাঙালি "পদ্মিনী" আর পুরুষ সমাজে "পুরুষিকা" — সব নারীবাচক উপমা মিলেই চূড়ান্ত সিদ্ধান্ত আসে: "অতএব আমরা মূর্তিমান কাব্য।"',source:'adapted · sohagschool.com'},
{q:'বাঙালি পুরুষকে লেখিকা কী বলেছেন?',a:'বাঙালি পুরুষকে লেখিকা "পুরুষিকা" বলেছেন — পুরুষ শব্দের সঙ্গে স্ত্রীবাচক "ইকা" প্রত্যয় জুড়ে তৈরি এক অভিনব ব্যঙ্গ-শব্দ। পাঠক থেকে পাঠিকা, লেখক থেকে লেখিকা হয় — সেই ব্যাকরণের ছাঁচেই পুরুষ থেকে "পুরুষিকা"; অর্থাৎ দেহে পুরুষ হলেও সাহস, শ্রম, তেজ — পুরুষোচিত গুণগুলোর কিছুই বাঙালির নেই। মার খেয়ে মোকদ্দমা করা, রোদ সইতে না পারা, ঝুঁকির ব্যবসা এড়ানো — প্রবন্ধ জুড়ে এই পৌরুষহীনতার প্রমাণ ছড়িয়ে আছে বলেই শব্দটি প্রবন্ধের তীক্ষ্ণতম অস্ত্র।',source:'adapted · sohagschool.com'},
{q:'বাঙালির খাদ্যসামগ্রী কেমন?',a:'বাঙালির খাদ্যসামগ্রী ত্রিগুণাত্মক — অর্থাৎ সরস, সুস্বাদু ও মধুর এই তিন গুণবিশিষ্ট। পুঁইশাকের ডাঁটা, সজিনা ও পুঁটি মাছের ঝোল অতিশয় সরস; ঘি, দুধ, ছানা, ক্ষীর, সন্দেশ ও রসগোল্লা অতিশয় সুস্বাদু; আর প্রধান ফল আম-কাঁঠাল রসাল ও মধুর — এই তিন দলের তিন গুণ মিলিয়েই "ত্রিগুণাত্মক" সিদ্ধান্ত। তবে প্রশংসার আড়ালে খোঁচাও আছে: এমন নরম-মিষ্টি-রসাল খাবার খেয়েই বাঙালির ভুঁড়ি হয়েছে স্থূল আর স্বভাব হয়েছে মাখনের মতো ভীরু — খাদ্যের গুণ যেন চরিত্রেও ফলেছে!',source:'AI_generated'},
{q:'আমাদের দেশের প্রধান ফল কী কী?',a:'প্রবন্ধ অনুযায়ী আমাদের দেশের প্রধান ফল আম্র (আম) ও কাঁঠাল, যেগুলো রসাল এবং মধুর। খাদ্যসামগ্রীর তিন গুণের তালিকায় এই দুটি ফলের "মধুর" গুণটিই তৃতীয় স্থান পূরণ করেছে — ঝোলের "সরস" আর দুধ-মিষ্টির "সুস্বাদু"-র সঙ্গে মিলে খাদ্য হয়েছে ত্রিগুণাত্মক। সাধু ভাষার "আম্র" রূপটি দেখে বিভ্রান্ত হওয়ার কিছু নেই — ওটাই আম; আর এমন মধুর ফল খেয়ে খেয়েই যে জাতির শরীর-মন দুটোই নরম-অলস হয়েছে, সেই পরোক্ষ খোঁচাটিও এখানে লুকিয়ে আছে।',source:'AI_generated'},
{q:'"হাওয়ার শাড়ি" কী?',a:'হাওয়ার শাড়ি হলো সূক্ষ্ম সুতোর তৈরি অতি পাতলা ও মসৃণ শাড়ি — নামটাই বলে দেয়, এত মিহি যেন হাওয়া দিয়ে বোনা। প্রবন্ধে বাঙালি নারীদের পোশাক-বিলাসিতার প্রসঙ্গে শব্দটি এসেছে: তাঁরা "অতিশয় সুকুমারী ললিতা লজ্জাবতী" বলে ইংরেজ নারীদের শেমিজ-জ্যাকেটকে নির্লজ্জ পরিচ্ছদ মনে করে বর্জন করেন, অথচ নিজেরা পরেন এই প্রায়-স্বচ্ছ পাতলা শাড়ি! লজ্জার দাবি আর পোশাকের বাস্তবতার এই স্ববিরোধই লেখিকার ব্যঙ্গের লক্ষ্য — লজ্জাবতীর পোশাকই সবচেয়ে পাতলা।',source:'existing · পাঠ্যবইয়ের টীকা'},
{q:'ইংরেজ ললনাদের নির্লজ্জ পরিচ্ছদ বলা হয়েছে কোনটিকে?',a:'ইংরেজ ললনাদের নির্লজ্জ পরিচ্ছদ বলা হয়েছে শেমিজ ও জ্যাকেটকে, যা বাঙালি নারীরা "অতিশয় সুকুমারী ললিতা লজ্জাবতী" বলে ব্যবহার করেন না। কিন্তু ব্যঙ্গটা এখানেই — সেই লজ্জাবতী নারীরাই পরেন অতি মসৃণ ও সূক্ষ্ম "হাওয়ার শাড়ি", যা শেমিজ-জ্যাকেটের চেয়েও পাতলা ও স্বচ্ছ! অর্থাৎ পরের পোশাককে নির্লজ্জ বলা আর নিজের প্রায়-স্বচ্ছ পোশাককে শালীন ভাবা — এই দ্বিচারিতাই লেখিকার নিশানা। তথ্যটি পাঠ্যবইয়ের সৃজনশীল প্রশ্নের ক-অংশে সরাসরি এসেছে বলে বিশেষ গুরুত্বপূর্ণ।',source:'AI_generated'},
{q:'ধনবৃদ্ধির দুই উপায় কী কী?',a:'প্রবন্ধ অনুযায়ী ধনবৃদ্ধির দুই উপায় হলো বাণিজ্য ও কৃষি, যার মধ্যে বাণিজ্যই বাঙালির প্রধান ব্যবসায়। কিন্তু লেখিকা দেখান, দুই পথেই বাঙালি কঠিন পরিশ্রম এড়িয়ে ফাঁকির রাস্তা ধরেছে — বাণিজ্যে সিন্দাবাদের মতো ঝুঁকি না নিয়ে সে বেচে নকল তেল আর ঝুটা গয়না, আর কৃষির বদলে বেছে নেয় ঘরে-বসা "brain culture"। অর্থাৎ ধনবৃদ্ধির দুটো সদর দরজা খোলা থাকতেও বাঙালি খুঁজে নিয়েছে আরামের চোরা-গলি — এই বাক্যটিই পরবর্তী দুই অংশের ব্যঙ্গের ভিত গড়ে দেয়।',source:'adapted · courstika.com'},
{q:'সিন্দাবাদ কোন গ্রন্থের চরিত্র?',a:'সিন্দাবাদ আরব্য উপন্যাসের (আরব্য রজনী) বিখ্যাত সওদাগর চরিত্র, যে সাত সমুদ্রে ঝুঁকিভরা বাণিজ্যযাত্রা করে বারবার সর্বস্ব হারিয়েও শেষে বিপুল ধনসম্পদের মালিক হয়েছিল। প্রবন্ধে লেখিকা লিখেছেন — আমরা সিন্দাবাদের মতো "অনিশ্চিত ফললাভের আশায়" বাণিজ্যপোত অপার সাগরে ভাসিয়ে "নৈরাশ্যের ঝঞ্ঝাবাতে" পড়ি না। তুলনাটির উদ্দেশ্য স্পষ্ট: সাহসী বণিকের বিপরীতে ঝুঁকিভীরু বাঙালিকে দাঁড় করানো — যে জাতি ঝড়ের ভয়ে বন্দরেই বসে থাকে, সমুদ্রের রত্ন তার ভাগ্যে জোটে না।',source:'AI_generated'},
{q:'"কুন্তলীন" ও "কেশলীন" কী?',a:'কুন্তলীন ও কেশলীন হলো লেখিকার আমলে প্রচলিত চুলে দেওয়ার তেলের নাম — কুন্তল ও কেশ দুটো শব্দেরই অর্থ চুল। কুন্তলীন ছিল আসল জনপ্রিয় ব্র্যান্ড; তার সাফল্য দেখে প্রায় একই ধাঁচের নাম রেখে বাজারে নামানো হয় নকল "কেশলীন" — প্রবন্ধের ভাষায়, "কুন্তলীনের সঙ্গে কেশলীন বিক্রয় হয়।" দীর্ঘকেশীর নকল হ্রস্বকেশীর মতোই এটি বাঙালির নকলপ্রবণতার বিখ্যাত উদাহরণ: অন্যের পরিশ্রমের ফসল দেখামাত্র হুবহু টুকে ফেলা, নিজে উদ্ভাবনের কষ্টটুকুও না করা।',source:'existing · পাঠ্যবইয়ের টীকা'},

'<strong>জ্ঞান:</strong> মন্তব্যটি সম্পূর্ণ যথার্থ — সম্মান অর্জনের জিনিস, কেনাকাটার নয়।<br><strong>ব্যাখ্যা:</strong> কেনা খেতাবের আয়ু প্রচারের আলো পর্যন্ত: পত্রিকার পাতা উল্টালেই তা ফুরায়, মানুষের মনে তার কোনো শিকড় গজায় না — বরং লোকে আড়ালে হাসে, কারণ সবাই জানে পদকটা কীভাবে এসেছে। আর প্রকৃত কীর্তি — একটি স্কুল, একটি হাসপাতাল, একজন মানুষের বদলে যাওয়া জীবন — কোনো প্রচার ছাড়াই প্রজন্মের পর প্রজন্ম কৃতজ্ঞতায় বেঁচে থাকে; কীর্তির প্রচারক স্বয়ং উপকৃত মানুষগুলোই।<br><strong>তুলনা:</strong> ইতিহাস এখানে নির্মম বিচারক — সেকালের শত শত খাঁ বাহাদুর-রায় বাহাদুরের নাম আজ কেউ মনে রাখেনি; তালিকাগুলো আর্কাইভের ধুলোয়। অথচ কোনো খেতাব না-নেওয়া রোকেয়া সাখাওয়াত হোসেন নারীশিক্ষার কীর্তিতে আজও জাতির হৃদয়ে — তাঁর নামে বিশ্ববিদ্যালয়, হল, দিবস; মৃত্যুর নব্বই বছর পরেও তাঁর জন্মদিনে ফুল পড়ে। উদ্দীপকের হাশেম আলীর নিয়তিও ইতিহাসের সেই প্রথম দলে — পদকগুলো তাঁর সঙ্গেই বিস্মৃত হবে; অথচ একই টাকায় গড়া একটি হাসপাতাল-ভবন তাঁকে শতবর্ষ বাঁচাতে পারত। কী কিনলেন আর কী হারালেন — এই হিসাবটাই তিনি করেননি।<br><strong>সিদ্ধান্ত:</strong> ব্যক্তি ও জাতির জন্য শিক্ষা একটাই — প্রদর্শনীতে নয়, কর্মে বিনিয়োগ করো; সম্মান তখন পেছন পেছন আসবে, ডাকতে হবে না। কেনা খেতাব হলো নকল হীরার আংটির মতো — দূর থেকে চকচকে, কাছে গেলেই ধরা; প্রবন্ধের নকল-ব্যঙ্গ আর খেতাব-ব্যঙ্গ আসলে একই সত্যের দুই প্রকাশ। মন্তব্যটি তাই প্রবন্ধের অন্যতম মর্মবাণী হিসেবেই সর্বাংশে যথার্থ।']]}

 mcq:[0,1,3,8,10,12,14,16,19,22,25,26,28,30,32,33,37,40,41,44,46,49,52,55,57,60,63,66,71,80],

<script>
const KEYS=['ক','খ','গ','ঘ'], CQ_MARKS=[1,2,3,4], CQ_LEVEL=['জ্ঞান','অনুধাবন','প্রয়োগ','উচ্চতর দক্ষতা'];
const LS='nirio-practice-v1';
let state=JSON.parse(localStorage.getItem(LS)||'{"mcq":{},"cq":{},"sq":{},"mode":"mcq"}');
if(!state.sq)state.sq={};
const save=()=>localStorage.setItem(LS,JSON.stringify(state));
const toBn=v=>String(v).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);

function mcqCard(m,idx,no){
 let h=`<article class="question"><div class="qtop"><div class="qnum">${toBn(no)}</div><div class="qbody">`;
 if(m.uddipok)h+=`<div class="uddipok"><em>উদ্দীপক</em>${m.uddipok}</div>`;
 h+=`<p class="qtext">${m.q} <span class="marks">[১]</span></p><div class="options">`;
 m.options.forEach((o,j)=>{h+=`<button class="opt" id="opt-${idx}-${j}" onclick="pick(${idx},${j})"><span class="k">${KEYS[j]}</span><span>${o}</span></button>`});
 h+=`</div><div class="verdict" id="ver-${idx}"></div>
  <div class="actions"><button class="solution-btn" onclick="toggleSol('m${idx}',this,'উত্তর ও বিস্তারিত ব্যাখ্যা')">উত্তর ও বিস্তারিত ব্যাখ্যা</button></div>
  <div class="solution" id="sol-m${idx}"><strong>সঠিক উত্তর: ${KEYS[m.answer]}</strong> — ${m.options[m.answer]}<span class="step">${m.explain}</span>${m.source?`<div class="src">উৎস: ${m.source}</div>`:''}</div>
 </div></div></article>`;
 return h;
}
function shortCard(s,idx,no){
 return `<article class="question"><div class="qtop"><div class="qnum">${toBn(no)}</div><div class="qbody">
  <p class="qtext">${s.q} <span class="marks">[২]</span></p>
  <div class="actions"><button class="solution-btn" onclick="toggleSol('s${idx}',this,'উত্তর দেখুন')">উত্তর দেখুন</button>
  <label class="done-label"><input type="checkbox" id="sdone-${idx}" ${state.sq[idx]?'checked':''} onchange="markShort(${idx},this.checked)"> পেরেছি</label></div>
  <div class="solution" id="sol-s${idx}"><strong>উত্তর:</strong> ${s.a}${s.explain?`<span class="step"><strong>ব্যাখ্যা:</strong> ${s.explain}</span>`:''}${s.source?`<div class="src">উৎস: ${s.source}</div>`:''}</div>
 </div></div></article>`;
}
function cqSubBlock(c,ci,j,showLevel=true){
 const s=c.subs[j];
 return `<div class="cq-sub"><div class="cq-k">${KEYS[j]}</div><div class="cq-body">${s[0]}
   <span class="marks">[${toBn(CQ_MARKS[j])}]</span>${showLevel?`<span class="level">${CQ_LEVEL[j]}</span>`:''}
   <div class="actions"><button class="solution-btn" onclick="toggleSol('c${ci}-${j}',this,'উত্তর দেখুন')">উত্তর দেখুন</button>
   <label class="done-label"><input type="checkbox" id="done-${ci}-${j}" ${state.cq[ci+'-'+j]?'checked':''} onchange="markDone(${ci},${j},this.checked)"> লিখেছি</label></div>
   <div class="solution" id="sol-c${ci}-${j}"><strong>উত্তর (${KEYS[j]})</strong><span class="step">${s[1]}</span>${c.source?`<div class="src">উৎস: ${c.source}</div>`:''}</div>
 </div></div>`;
}
function fullCqCard(c,ci,no){
 let h=`<article class="question"><div class="qtop"><div class="qnum">${toBn(no)}</div><div class="qbody">
  <div class="uddipok"><em>উদ্দীপক</em>${c.uddipok}</div>`;
 c.subs.forEach((_,j)=>h+=cqSubBlock(c,ci,j));
 h+=`</div></div></article>`;
 return h;
}

 document.getElementById('examTitle').textContent=v.title;
 document.getElementById('examSubtitle').textContent=v.sub;
 document.getElementById('instBox').innerHTML='<strong>নির্দেশনা:</strong> '+v.inst;
 const[mc,mm]=v.meta();
 document.getElementById('metaCount').textContent=mc;
 document.getElementById('metaMarks').textContent=mm;
 document.getElementById('questions').innerHTML=v.render();
 restore();
 window.scrollTo({top:0});
}
function pick(i,j){
 if(state.mcq[i]!==undefined)return;
 state.mcq[i]=j;save();paintMcq(i);updateProgress();
}
function paintMcq(i){
 const picked=state.mcq[i];if(picked===undefined)return;
 const m=mcqBank[i];if(!m)return;
 document.querySelectorAll(`[id^="opt-${i}-"]`).forEach((el,j)=>{
  el.disabled=true;
  if(j===m.answer)el.classList.add('correct');
  else if(j===picked)el.classList.add('wrong');
 });
 const v=document.getElementById('ver-'+i);
 if(!v)return;
 if(picked===m.answer){v.textContent='✔ সঠিক!';v.className='verdict right'}
 else{v.textContent='✘ ভুল — বিস্তারিত ব্যাখ্যা দেখে নাও।';v.className='verdict wrong';
  const s=document.getElementById('sol-m'+i);if(s)s.classList.add('open')}
}
function markDone(i,j,checked){state.cq[i+'-'+j]=checked;save();updateProgress()}
function markShort(i,checked){state.sq[i]=checked;save();updateProgress()}
function restore(){
 Object.keys(state.mcq).forEach(i=>paintMcq(+i));
 Object.keys(state.cq).forEach(k=>{const el=document.getElementById('done-'+k);if(el)el.checked=!!state.cq[k]});
 Object.keys(state.sq).forEach(k=>{const el=document.getElementById('sdone-'+k);if(el)el.checked=!!state.sq[k]});
 updateProgress();
}
function updateProgress(){
 const total=mcqBank.length+shortBank.length+cqBank.length*4;
 const answered=Object.keys(state.mcq).length;
 const right=Object.keys(state.mcq).filter(i=>mcqBank[i]&&state.mcq[i]===mcqBank[i].answer).length;
 const done=answered+Object.values(state.cq).filter(Boolean).length+Object.values(state.sq).filter(Boolean).length;
 document.getElementById('progressText').textContent=`সম্পন্ন ${toBn(done)}/${toBn(total)} · MCQ সঠিক ${toBn(right)}`;
 document.getElementById('progressFill').style.width=Math.min(done/total*100,100)+'%';
}
function toggleSol(id,btn,label){const el=document.getElementById('sol-'+id);const open=el.classList.toggle('open');
 if(btn)btn.textContent=open?'উত্তর লুকান':label}
function toggleAll(show){document.querySelectorAll('.solution').forEach(el=>el.classList.toggle('open',show));
 document.querySelectorAll('.solution-btn').forEach(b=>{if(show)b.textContent='উত্তর লুকান';
  else b.textContent=b.getAttribute('onclick').includes("'m")?'উত্তর ও বিস্তারিত ব্যাখ্যা':'উত্তর দেখুন'});
 toast(show?'সব উত্তর খোলা হয়েছে':'সব উত্তর লুকানো হয়েছে')}
function resetAll(){state={mcq:{},cq:{},sq:{},mode:state.mode};save();setMode(state.mode);toast('নতুন করে শুরু হলো')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');
 clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800)}
setMode(state.mode||'mcq');
</script>
